name: Daily bedtime story

on:
  schedule:
    # GitHub cron is UTC only. 8 PM Brussels is 18:00 UTC in summer (CEST)
    # and 19:00 UTC in winter (CET), so we trigger at both times and the
    # "Check Brussels time" step lets only the run at 20:xx local time proceed.
    - cron: "0 18 * * *"
    - cron: "0 19 * * *"
  workflow_dispatch: # manual run: always generates today's story

permissions:
  contents: write # needed to commit the story file

concurrency:
  group: daily-story
  cancel-in-progress: false

jobs:
  story:
    runs-on: ubuntu-latest
    steps:
      - name: Check Brussels time
        id: gate
        run: |
          hour=$(TZ=Europe/Brussels date +%H)
          if [ "${{ github.event_name }}" = "schedule" ] && [ "$hour" != "20" ]; then
            echo "Brussels hour is $hour, not 20 - skipping."
            echo "run=false" >> "$GITHUB_OUTPUT"
          else
            echo "run=true" >> "$GITHUB_OUTPUT"
          fi

      - uses: actions/checkout@v4
        if: steps.gate.outputs.run == 'true'

      - name: Generate story
        if: steps.gate.outputs.run == 'true'
        run: python3 scripts/generate_story.py

      - name: Commit story if changed
        if: steps.gate.outputs.run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add stories
          if git diff --cached --quiet; then
            echo "No new story to commit."
          else
            git commit -m "Add bedtime story for $(TZ=Europe/Brussels date +%F)"
            git push
          fi
